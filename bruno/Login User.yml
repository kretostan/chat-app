info:
  name: Login User
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/auth/login"
  body:
    type: json
    data: |-
      {
          "username": "{{username}}",
          "password": "{{password}}",
          "deviceName": "Google Chrome, Linux",
          "sessionUuid": "1a0641bc-68ac-4e99-bba2-f67c055407ba"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
