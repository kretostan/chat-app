info:
  name: Remove session
  type: http
  seq: 5

http:
  method: POST
  url: "{{host}}/auth/sessions/:id/logout"
  params:
    - name: id
      value: '"random"'
      type: path
  body:
    type: text
    data: |-
      {
          "login": "alice@example.com",
          "password": "password123",
          "deviceName": "Google Chrome, Linux",
          "sessionUuid": "c69f00d0-cbaa-48db-8114-fd47e3e8907b"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
