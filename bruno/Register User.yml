info:
  name: Register User
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/auth/register"
  body:
    type: json
    data: |-
      {
          "username": "{{username}}",
          "email": "{{email}}",
          "password": "{{password}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
