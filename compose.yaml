services:
  backend:
    image: ghcr.io/kretostan/chat-app/backend:latest
    container_name: chat-app-backend
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/chat.db
      - PORT=3000
    ports:
      - "3000"
    volumes:
      - chat-data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e ''require("http").get("http://localhost:3000/api/health", (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })''',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/kretostan/chat-app/frontend:latest
    container_name: chat-app-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  chat-data:
