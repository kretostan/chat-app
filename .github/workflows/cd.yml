name: CD Pipeline (Deploy to Production)

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Zezwolenie na zapis obrazów do GHCR

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ghcr.io/kretostan/chat-app/backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ghcr.io/kretostan/chat-app/frontend:latest

  deploy:
    name: Deploy via SSH (Podman)
    runs-on: ubuntu-latest
    needs: [build-and-push]

    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            podman compose -p chat-app -f compose.yaml pull
            podman compose -p chat-app -f compose.yaml up -d
            podman compose image prune -f
